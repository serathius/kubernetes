kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  "ListFromCacheSnapshot": false
nodes:
- role: control-plane
  extraMounts:
  - hostPath: ./patches
    containerPath: /patches
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    controllerManager:
      extraArgs:
        bind-address: "0.0.0.0"
    scheduler:
      extraArgs:
        bind-address: "0.0.0.0"
    apiServer:
      extraArgs:
        "v": "3"
        "enable-priority-and-fairness": "true"
        "max-requests-inflight": "10"
        "max-mutating-requests-inflight": "10"
  - |
    kind: InitConfiguration
    patches:
      directory: /patches
