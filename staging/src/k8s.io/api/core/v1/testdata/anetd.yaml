          name: cilium-config
          optional: true
    image: us-east5-artifactregistry.gcr.io/gke-release/gke-release/cilium/cilium:v1.17.8-gke1.34-gke.1@sha256:76c275c44c4934eacafa33acbe659e8b1485316e01dbd15ef00ced46d1f5be89
    imagePullPolicy: IfNotPresent
