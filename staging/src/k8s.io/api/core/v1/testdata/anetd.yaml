  name: anetd-244wb
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchFields:
          - key: metadata.name
            operator: In
            values:
            - gke-tpu-6291e798-nd5p
  automountServiceAccountToken: false
  containers:
  - args:
    - |
      exec {BASH_XTRACEFD}>&1 && set -x

      if [[ -n "$${CILIUM_CONFIG_MAP}" ]] \
          && [[ ! -f "$${CILIUM_CONFIG_MAP}/mtu" ]] \
          && [[ -n "$${MTU_DEVICE_IP}" ]]; then
        # Get mtu of the interface which has ip address '$${MTU_DEVICE_IP}'
        mtu="$$(ip addr show to "$${MTU_DEVICE_IP}" | grep mtu | awk '{for (I=1;I<NF;I++) if ($$I == "mtu") print $$(I+1)}')"

        # Check if we could retrive a number in 'mtu'
        if [[ "$${mtu}" =~ ^[0-9]+$$ ]]; then
          mtuArg="--mtu=$${mtu}"
        fi
      fi

      exec /usr/bin/cilium-agent \
        --k8s-kubeconfig-path=/var/lib/kubelet/kubeconfig \
        --config-dir="$${CILIUM_CONFIG_MAP}" \
        $${mtuArg:-}
    command:
    - bash
    - -euc
    env:
    - name: GOPS_CONFIG_DIR
      value: /.config
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: spec.nodeName
    - name: CILIUM_K8S_NAMESPACE
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: metadata.namespace
    - name: CILIUM_FLANNEL_MASTER_DEVICE
      valueFrom:
        configMapKeyRef:
          key: flannel-master-device
          name: cilium-config
          optional: true
    - name: CILIUM_FLANNEL_UNINSTALL_ON_EXIT
      valueFrom:
        configMapKeyRef:
          key: flannel-uninstall-on-exit
          name: cilium-config
          optional: true
    - name: MTU_DEVICE_IP
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: status.hostIP
    - name: CILIUM_CONFIG_MAP
      value: /tmp/cilium/config-map
    - name: CILIUM_CLUSTERMESH_CONFIG
      value: /var/lib/cilium/clustermesh/
    - name: CILIUM_CNI_CHAINING_MODE
      valueFrom:
        configMapKeyRef:
          key: cni-chaining-mode
