{{$group := DefaultParam .group "bench-pod"}}

apiVersion: v1
kind: Pod
metadata:
  name: {{.Name}}
  labels:
    group: {{$group}}
    app.kubernetes.io/name: "payment-processing-engine"
    app.kubernetes.io/instance: "payment-processing-engine-primary"
    app.kubernetes.io/version: "v3.18.2"
    app.kubernetes.io/component: "transaction-processor"
    app.kubernetes.io/part-of: "cloud-billing-platform"
    app.kubernetes.io/managed-by: "helm"
    helm.sh/chart: "transaction-processor-4.2.1"
    tags.datadoghq.com/env: "production"
    tags.datadoghq.com/service: "payment-processing-engine"
    tags.datadoghq.com/version: "3.18.2"
    security.istio.io/tlsMode: "istio"
    service.istio.io/canonical-name: "payment-processing-engine"
    service.istio.io/canonical-revision: "v3.18.2"
    env: "production"
    tier: "backend"
    track: "stable"
    region: "us-central1"
    zone: "us-central1-a"
    team: "payments-core"
    compliance.pci.org/scope: "in-scope"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
    prometheus.io/scheme: "http"
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/status: "{\"version\":\"8475fa3d88b48f93ecbe397ef03b90df723821a1-clean\",\"initContainers\":[\"istio-init\"],\"containers\":[\"istio-proxy\"],\"volumes\":[\"workload-socket\",\"workload-certs\",\"istio-envoy\",\"istio-data\",\"istio-podinfo\",\"istio-token\",\"istiod-ca-cert\"]}"
    sidecar.istio.io/proxyCPU: "250m"
    sidecar.istio.io/proxyMemory: "512Mi"
    traffic.sidecar.istio.io/excludeInboundPorts: "15020,15021,15090"
    traffic.sidecar.istio.io/includeOutboundIPRanges: "*"
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "payment-processor-vault-role"
    vault.hashicorp.com/agent-inject-secret-db-creds: "database/creds/payment-processor"
    vault.hashicorp.com/agent-inject-secret-api-keys: "secret/data/payments/apikeys"
    vault.hashicorp.com/agent-inject-secret-jwt: "secret/data/payments/jwt-signing-key"
    vault.hashicorp.com/agent-pre-populate-only: "true"
    fluentbit.io/parser: "json"
    fluentbit.io/include: "true"
    fluentbit.io/exclude: "false"
    linkerd.io/inject: "disabled"
    argocd.argoproj.io/hook: "Sync"
    argocd.argoproj.io/hook-delete-policy: "BeforeHookCreation"
    argocd.argoproj.io/sync-wave: "5"
    keda.sh/scaledobject-name: "payment-processor-autoscaler"
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    cert-manager.io/issuer: "letsencrypt-production"
    checksum/config: "b8577c38c823ea9ef9b964344be6c1a84f4e7c3b28f7422fbc453bfbc5ef294f"
    checksum/secret: "9f8337a620b7efb31d4e419846b4ef84c7e638974a9572ea0b571168f1251e62"
    co.elastic.logs/enabled: "true"
    backstage.io/kubernetes-id: "payment-processor-service"
spec:
  schedulerName: "non-existent-scheduler"
  nodeSelector:
    kubernetes.io/hostname: "non-existent-node"
  readinessGates:
  - conditionType: "target-health.alb.ingress.k8s.aws/payment-ingress"
  - conditionType: "cloud.google.com/neg-ready"
  - conditionType: "service.istio.io/ready"
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: "topology.kubernetes.io/zone"
    whenUnsatisfiable: "ScheduleAnyway"
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: "payment-processing-engine"
        app.kubernetes.io/component: "transaction-processor"
        env: "production"
  - maxSkew: 2
    topologyKey: "kubernetes.io/hostname"
    whenUnsatisfiable: "DoNotSchedule"
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: "payment-processing-engine"
        app.kubernetes.io/instance: "payment-processing-engine-primary"
  - maxSkew: 1
    topologyKey: "topology.kubernetes.io/region"
    whenUnsatisfiable: "ScheduleAnyway"
    labelSelector:
      matchExpressions:
      - key: "app.kubernetes.io/part-of"
        operator: In
        values: ["cloud-billing-platform"]
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: "app.kubernetes.io/name"
              operator: In
              values: ["payment-processing-engine", "transaction-processor"]
            - key: "env"
              operator: In
              values: ["production"]
          topologyKey: "kubernetes.io/hostname"
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: "cloud-billing-platform"
          topologyKey: "topology.kubernetes.io/zone"
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: "app.kubernetes.io/component"
              operator: In
              values: ["redis-cache", "database-proxy"]
          topologyKey: "topology.kubernetes.io/zone"
  tolerations:
  - key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 300
  - key: "node.kubernetes.io/unreachable"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 300
  - key: "cloud.google.com/gke-spot"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
  - key: "dedicated"
    operator: "Equal"
    value: "payments-workload"
    effect: "NoSchedule"
  initContainers:
  - name: init-certificates
    image: {{.ImageRegistry}}/e2e-test-images/agnhost:2.53
    command: ["/bin/sh", "-c", "sleep 1"]
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: VAULT_ADDR
      value: "https://vault.internal.corp:8200"
    - name: VAULT_AUTH_PATH
      value: "auth/kubernetes"
    - name: VAULT_ROLE
      value: "payment-processor-vault-role"
    - name: CERT_ROTATION_INTERVAL
      value: "24h"
    - name: TLS_CIPHER_SUITES
      value: "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
    - name: TLS_MIN_VERSION
      value: "VersionTLS13"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    volumeMounts:
    - mountPath: /var/certs
      name: tls-certs
    - mountPath: /var/config
      name: configmap
  - name: init-database-schema
    image: {{.ImageRegistry}}/e2e-test-images/agnhost:2.53
    command: ["/bin/sh", "-c", "sleep 1"]
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: DB_MIGRATION_AUTO_RUN
      value: "true"
    - name: DB_CONNECTION_TIMEOUT_MS
      value: "10000"
    - name: DB_SCHEMA_VERSION
      value: "2026.04.12"
    - name: DB_LOCK_TIMEOUT_SECONDS
      value: "60"
    - name: FLYWAY_BASELINE_ON_MIGRATE
      value: "true"
    - name: FLYWAY_LOCATIONS
      value: "filesystem:/var/migrations/sql"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    volumeMounts:
    - mountPath: /var/migrations
      name: configmap
    - mountPath: /var/secrets/database
      name: secret
  containers:
  - name: main
    image: {{.ImageRegistry}}/pause:3.9
    ports:
    - name: http-api
      containerPort: 8080
      protocol: TCP
    - name: grpc-api
      containerPort: 9090
      protocol: TCP
    - name: metrics
      containerPort: 9100
      protocol: TCP
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: SERVICE_ACCOUNT
      valueFrom:
        fieldRef:
          fieldPath: spec.serviceAccountName
    - name: HOST_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: GOMAXPROCS
      valueFrom:
        resourceFieldRef:
          containerName: main
          resource: limits.cpu
    - name: GOMEMLIMIT
      valueFrom:
        resourceFieldRef:
          containerName: main
          resource: limits.memory
    - name: JAVA_TOOL_OPTIONS
      value: "-XX:MaxRAMPercentage=75.0 -XX:+CrashOnOutOfMemoryError -XX:+UseG1GC"
    - name: APPLICATION_ENV
      value: "production"
    - name: SPRING_PROFILES_ACTIVE
      value: "production,kubernetes,cloud-gcp,metrics-prometheus,tracing-otlp"
    - name: SERVER_PORT
      value: "8080"
    - name: MANAGEMENT_SERVER_PORT
      value: "9100"
    - name: LOGGING_LEVEL_ROOT
      value: "INFO"
    - name: LOGGING_LEVEL_COM_PAYMENTS
      value: "DEBUG"
    - name: LOGGING_FORMAT
      value: "ecs-json"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://otel-collector.monitoring.svc.cluster.local:4317"
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    - name: OTEL_SERVICE_NAME
      value: "payment-processing-engine"
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "service.name=payment-processing-engine,service.namespace=cloud-billing,deployment.environment=production"
    - name: OTEL_TRACES_SAMPLER
      value: "parentbased_traceidratio"
    - name: OTEL_TRACES_SAMPLER_ARG
      value: "0.25"
    - name: REDIS_PRIMARY_HOST
      value: "redis-master.cache.svc.cluster.local"
    - name: REDIS_PRIMARY_PORT
      value: "6379"
    - name: REDIS_DATABASE
      value: "0"
    - name: REDIS_POOL_MAX_ACTIVE
      value: "200"
    - name: REDIS_CONNECTION_TIMEOUT_MS
      value: "2000"
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: "kafka-0.kafka-headless.streaming.svc.cluster.local:9092,kafka-1.kafka-headless.streaming.svc.cluster.local:9092"
    - name: KAFKA_CONSUMER_GROUP_ID
      value: "payment-processor-group-v3"
    - name: KAFKA_TOPIC_INCOMING_TRANSACTIONS
      value: "prod.payments.incoming-events.v2"
    - name: KAFKA_TOPIC_COMPLETED_TRANSACTIONS
      value: "prod.payments.settlement-events.v2"
    - name: KAFKA_TOPIC_DEAD_LETTER_QUEUE
      value: "prod.payments.dead-letter-queue.v1"
    - name: KAFKA_PRODUCER_ACKS
      value: "all"
    - name: KAFKA_PRODUCER_RETRIES
      value: "10"
    - name: KAFKA_PRODUCER_LINGER_MS
      value: "20"
    - name: KAFKA_CONSUMER_MAX_POLL_RECORDS
      value: "500"
    - name: KAFKA_CONSUMER_AUTO_OFFSET_RESET
      value: "latest"
    - name: DATABASE_JDBC_URL
      value: "jdbc:postgresql://db-primary.payments.svc.cluster.local:5432/payment_transactions_db?sslmode=verify-full&sslrootcert=/var/certs/ca.pem"
    - name: DATABASE_POOL_MAX_SIZE
      value: "50"
    - name: DATABASE_POOL_IDLE_TIMEOUT_MS
      value: "300000"
    - name: DATABASE_MAX_LIFETIME_MS
      value: "1800000"
    - name: DATABASE_STATEMENT_TIMEOUT_MS
      value: "5000"
    - name: DATABASE_CONNECTION_ACQUISITION_TIMEOUT_MS
      value: "3000"
    - name: TRANSACTION_PROCESSING_TIMEOUT_MS
      value: "8000"
    - name: CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD
      value: "50.0"
    - name: CIRCUIT_BREAKER_SLOW_CALL_RATE_THRESHOLD
      value: "50.0"
    - name: CIRCUIT_BREAKER_SLOW_CALL_DURATION_THRESHOLD_MS
      value: "3000"
    - name: RATE_LIMITER_LIMIT_FOR_PERIOD
      value: "5000"
    - name: RETRY_MAX_ATTEMPTS
      value: "3"
    - name: RETRY_BACKOFF_MULTIPLIER
      value: "2.0"
    - name: CACHE_TTL_SECONDS
      value: "3600"
    - name: AUDIT_LOG_ENABLED
      value: "true"
    - name: HTTP_CLIENT_CONNECT_TIMEOUT_MS
      value: "3000"
    - name: HTTP_CLIENT_READ_TIMEOUT_MS
      value: "5000"
    - name: HTTP_CLIENT_MAX_TOTAL_CONNECTIONS
      value: "1000"
    - name: SECURITY_JWT_ISSUER
      value: "https://auth.internal.corp/oauth2/token"
    - name: SECURITY_JWT_AUDIENCE
      value: "payment-api"
    - name: METRICS_JVM_BUFFER_METRICS_ENABLED
      value: "true"
    resources:
      requests:
        cpu: 500m
        memory: 1024Mi
      limits:
        cpu: 2000m
        memory: 2048Mi
    volumeMounts:
    - mountPath: /var/configmap
      name: configmap
    - mountPath: /var/secret
      name: secret
    - mountPath: /var/certs
      name: tls-certs
    - mountPath: /var/run/secrets/tokens
      name: projected-service-tokens
    - mountPath: /tmp
      name: scratch-volume
    - mountPath: /var/log/application
      name: app-logs
    - mountPath: /var/cache/app
      name: app-cache
    livenessProbe:
      httpGet:
        path: /health/liveness
        port: 9100
        scheme: HTTP
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health/readiness
        port: 9100
        scheme: HTTP
      initialDelaySeconds: 15
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: /health/startup
        port: 9100
        scheme: HTTP
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 30
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      capabilities:
        drop:
        - ALL
  - name: istio-proxy
    image: {{.ImageRegistry}}/pause:3.9
    ports:
    - name: status-port
      containerPort: 15021
      protocol: TCP
    - name: proxy-metrics
      containerPort: 15090
      protocol: TCP
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: INSTANCE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: SERVICE_ACCOUNT
      valueFrom:
        fieldRef:
          fieldPath: spec.serviceAccountName
    - name: ISTIO_META_WORKLOAD_NAME
      value: "payment-processing-engine"
    - name: ISTIO_META_OWNER
      value: "kubernetes://apis/apps/v1/namespaces/default/deployments/payment-processing-engine"
    - name: ISTIO_META_MESH_ID
      value: "prod-mesh-01"
    - name: ISTIO_META_CLUSTER_ID
      value: "gke-us-central1-prod-cluster-1"
    - name: ISTIO_META_NETWORK
      value: "prod-vpc-network"
    - name: PROXY_CONFIG
      value: "{\"discoveryAddress\":\"istiod.istio-system.svc:15012\"}"
    - name: PILOT_CERT_PROVIDER
      value: "istiod"
    - name: CA_ADDR
      value: "istiod.istio-system.svc:15012"
    - name: STATS_INCLUSION_PREFIXES
      value: "cluster.outbound,listener,http.inbound"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    volumeMounts:
    - mountPath: /var/run/secrets/istio
      name: tls-certs
    - mountPath: /etc/istio/proxy
      name: scratch-volume
    - mountPath: /etc/istio/config
      name: configmap
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1337
      runAsGroup: 1337
      capabilities:
        drop:
        - ALL
  - name: fluentbit-sidecar
    image: {{.ImageRegistry}}/pause:3.9
    ports:
    - name: fb-metrics
      containerPort: 2020
      protocol: TCP
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: FLUENT_LOG_LEVEL
      value: "info"
    - name: FLUENT_STORAGE_TYPE
      value: "memory"
    - name: FLUENT_FLUSH_INTERVAL
      value: "1"
    - name: FLUENT_BUFFER_CHUNK_SIZE
      value: "512k"
    - name: FLUENT_BUFFER_MAX_SIZE
      value: "5M"
    - name: FLUENT_OUTPUT_HOST
      value: "log-aggregator.logging.svc.cluster.local"
    - name: FLUENT_OUTPUT_PORT
      value: "24224"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    volumeMounts:
    - mountPath: /var/log/application
      name: app-logs
      readOnly: true
    - mountPath: /fluent-bit/etc
      name: configmap
    - mountPath: /fluent-bit/storage
      name: scratch-volume
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      capabilities:
        drop:
        - ALL
  - name: otel-collector-sidecar
    image: {{.ImageRegistry}}/pause:3.9
    ports:
    - name: otlp-grpc
      containerPort: 4317
      protocol: TCP
    - name: otlp-http
      containerPort: 4318
      protocol: TCP
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: GOMEMLIMIT
      valueFrom:
        resourceFieldRef:
          containerName: otel-collector-sidecar
          resource: limits.memory
    - name: OTEL_LOG_LEVEL
      value: "info"
    - name: OTEL_SAMPLING_RATE
      value: "0.2"
    - name: OTEL_BATCH_TIMEOUT
      value: "5s"
    - name: OTEL_BATCH_SEND_BATCH_SIZE
      value: "8192"
    - name: OTEL_BACKEND_EXPORTER_ENDPOINT
      value: "tempo-distributor.tracing.svc.cluster.local:4317"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    volumeMounts:
    - mountPath: /etc/otelcol
      name: configmap
    - mountPath: /var/run/secrets/tokens
      name: projected-service-tokens
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      capabilities:
        drop:
        - ALL
  volumes:
  - name: configmap
    configMap:
      name: {{.Name}}
      optional: true
  - name: secret
    secret:
      secretName: {{.Name}}
      optional: true
  - name: tls-certs
    secret:
      secretName: {{.Name}}-certs
      optional: true
  - name: scratch-volume
    emptyDir:
      medium: Memory
      sizeLimit: 128Mi
  - name: app-logs
    emptyDir: {}
  - name: app-cache
    emptyDir:
      medium: Memory
      sizeLimit: 256Mi
  - name: projected-service-tokens
    projected:
      sources:
      - serviceAccountToken:
          audience: "https://vault.internal.corp"
          expirationSeconds: 7200
          path: vault-token
      - serviceAccountToken:
          audience: "https://iam.googleapis.com/projects/corp-prod/locations/global/workloadIdentityPools/gke-pool/providers/gke-provider"
          expirationSeconds: 3600
          path: gcp-token
      - configMap:
          name: {{.Name}}
          optional: true
          items:
          - key: ca-bundle.crt
            path: certs/ca-bundle.crt
      - downwardAPI:
          items:
          - path: "labels"
            fieldRef:
              fieldPath: metadata.labels
          - path: "annotations"
            fieldRef:
              fieldPath: metadata.annotations
