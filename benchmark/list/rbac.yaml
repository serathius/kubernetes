---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: benchmark-list
rules:
  - apiGroups: [""]
    resources:
      - pods
      - configmaps
      - secrets
    verbs:
      - list
      - create
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-list-1
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: default-benchmark-list-1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: benchmark-list
subjects:
  - kind: ServiceAccount
    name: benchmark-list-1
    namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-list-2
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: default-benchmark-list-2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: benchmark-list
subjects:
  - kind: ServiceAccount
    name: benchmark-list-2
    namespace: default
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-list-1
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-system-benchmark-list-1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: benchmark-list
subjects:
  - kind: ServiceAccount
    name: benchmark-list-1
    namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-list-2
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-system-benchmark-list-2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: benchmark-list
subjects:
  - kind: ServiceAccount
    name: benchmark-list-2
    namespace: kube-system
