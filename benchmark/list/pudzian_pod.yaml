        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsGroup: 3000
      runAsUser: 1000
    volumeMounts:
    - mountPath: /etc/config
      name: config-volume
      readOnly: true
    - mountPath: /etc/secrets
      name: secret-volume
      readOnly: true
    - mountPath: /data
      name: data-volume
    - mountPath: /mnt/extra/0
      name: extra-volume-0
    - mountPath: /mnt/extra/1
      name: extra-volume-1
